# Image Actions will run in the following scenarios:
# - on push to `main` when files under metadata/*/assets change (new/updated posters)
# - on demand (https://github.blog/changelog/2020-07-06-github-actions-manual-triggers-with-workflow_dispatch/)
# - daily at 01:00 UTC as a safety net for anything missed
# Resized/compressed images are committed directly to `main`.
# Runs are queued (not parallel) via `concurrency`, and the final push retries with
# rebase if `main` moved while this run was resizing/compressing, so back-to-back
# uploads don't fail each other with a rejected push.

---
name: Compress images

on:
  push:
    branches:
      - main
    paths:
      - "metadata/movies/assets/**"
      - "metadata/tv/assets/**"
  workflow_dispatch:
  schedule:
    # Every day at 01:00 (UTC)
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: image-compress
  cancel-in-progress: false

jobs:
  build:
    name: calibreapp/image-actions
    runs-on: ubuntu-latest
    # Only run on main repo
    if: github.repository == 'jasimancas/kometa'
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Resize oversized posters
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          find metadata/movies/assets metadata/tv/assets -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
            -print0 | xargs -0 mogrify -resize '1000x1500>'

      - name: Compress Images
        id: calibre
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # Scheduled/manual runs are not PRs, so compressOnly should be true
          compressOnly: true

      - name: Commit and Push to main
        run: |
          # Commit only if there are changes
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🍱 Resize & compress images"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push correcto (intento $attempt)."
              exit 0
            fi

            echo "Push rechazado (intento $attempt/5). main se movió, reintentando con rebase..."
            git fetch origin main
            git rebase origin/main
          done

          echo "No se pudo empujar tras 5 intentos."
          exit 1
